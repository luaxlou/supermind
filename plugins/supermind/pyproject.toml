[project]
name = "supermind-capability-memory"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastembed==0.8.0",
  "filelock==3.32.5",
  "huggingface-hub==1.30.0",
  "lancedb==0.38.0",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: downloads and exercises the pinned embedding model"]
