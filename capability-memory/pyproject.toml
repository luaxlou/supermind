[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "supermind-capability-memory"
version = "0.3.16"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastembed==0.8.0",
  "filelock==3.32.5",
  "huggingface-hub==1.30.0",
  "lancedb==0.38.0",
  "pyyaml==6.0.3",
]

[project.scripts]
supermind-memory = "supermind_memory.cli:main"

[dependency-groups]
dev = ["jsonschema==4.25.1", "pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/supermind_memory"]

[tool.hatch.build.targets.wheel.force-include]
"model.lock.json" = "supermind_memory/data/model.lock.json"
"evaluation" = "supermind_memory/data/evaluation"
"schemas" = "supermind_memory/data/schemas"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: downloads and exercises the pinned embedding model"]
